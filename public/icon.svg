<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Monster Cyber Horns / Silhouette -->
  <path d="M 120 180 C 90 100, 160 80, 200 150 C 180 180, 150 190, 120 180 Z" fill="url(#hornGrad)" opacity="0.9" />
  <path d="M 392 180 C 422 100, 352 80, 312 150 C 332 180, 362 190, 392 180 Z" fill="url(#hornGrad)" opacity="0.9" />

  <!-- Monster Core Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" />

  <!-- Geometric Cyber Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" stroke-dasharray="40 20" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8" stroke-dasharray="30 15" />

  <!-- Center Jarvis Monster Core / Eye -->
  <polygon points="256,170 320,230 290,320 222,320 192,230" fill="#020617" stroke="#38bdf8" stroke-width="4" />
  <circle cx="256" cy="256" r="36" fill="#38bdf8" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
  
  <!-- Sound Wave Spikes -->
  <path d="M 150 256 L 120 256 M 362 256 L 392 256 M 256 150 L 256 120 M 256 362 L 256 392" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
</svg>
